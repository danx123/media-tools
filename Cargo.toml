[package]
name = "media_tools"
version = "0.1.0"
edition = "2021"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
ffmpeg-next = { version = "7.0", features = ["static"], default-features = false }
numpy = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
