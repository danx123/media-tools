[package]
name = "media_tools"
version = "0.4.0"
edition = "2021"

[dependencies]
# abi3-py310: build SEKALI, wheel-nya jalan di Python 3.10, 3.11, 3.12, 3.13,
# dst tanpa perlu rebuild per versi. Penting karena media_tools sekarang
# dipakai lintas app (player/viewer + macan_converter), dan tiap app belum
# tentu di-bundle sama versi Python yang sama pas di-Nuitka-in -- sebelum ini
# tiap kombinasi python minor version butuh wheel-nya sendiri.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"
mp4 = "0.13.0"
matroska = "0.6.0"
# rayon: paralelisasi compute_waveform_envelope() & detect_bpm() (lib.rs)
# di banyak core CPU. Pure-Rust, gak butuh link ke lib sistem apapun,
# jadi aman dipakai di build Windows CI ini (beda kasus sama ffmpeg/
# libvpx yg sengaja dihindari -- lihat catatan decode_vp9_frame di bawah).
rayon = "1"
# CATATAN: decode_vp9_frame() di lib.rs GAK butuh crate ffmpeg/libvpx Rust
# (mis. `ffmpeg-next` / `ffmpeg-sys-next`) -- itu sengaja dihindari krn bakal
# butuh link statis/dinamis ke libav*/libvpx pas build (ribet & rapuh di CI
# Windows). Sama kayak fungsi frame-grab lain, VP9 decode tetep lewat spawn
# proses `ffmpeg.exe` eksternal (dicari via set_ffmpeg_dir()/resolve_exe()),
# cuma dipaksa pakai decoder "-c:v libvpx-vp9" biar gak salah auto-probe.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
