name: Build Media Tools

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Kompilasi media_tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang Rust + Tools Build
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Pasang Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pasang Maturin
        run: pip install maturin

      - name: ⚙️ Siapkan Variabel — Hindari Deteksi FFmpeg Sistem
        env:
          FFMPEG_SYS_NEXT_USE_PKG_CONFIG: "0"
        run: |
          echo "FFMPEG_SYS_NEXT_USE_PKG_CONFIG=0" >> $env:GITHUB_ENV

      - name: 🔨 Kompilasi (FFmpeg statis dari sumber)
        env:
          FFMPEG_SYS_NEXT_USE_PKG_CONFIG: "0"
        run: maturin build --release --out dist

      - name: 📋 Lihat Hasil
        run: dir dist/

      - name: 📤 Unggah Artefak
        uses: actions/upload-artifact@v4
        with:
          name: media-tools-windows
          path: dist/*.whl
